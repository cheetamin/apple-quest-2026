# 가래떡 모션 게임: 자세 인식(MediaPipe) 파일을 같은 사이트에 올려 두기
# 학교망에서 storage.googleapis.com / cdn.jsdelivr.net 이 막혀도 동작하도록 한다.
name: garaetteok-vendor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/garaetteok-vendor.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download MediaPipe tasks-vision 0.10.14 + pose models
        run: |
          set -e
          D=docs/garaetteok/vendor/mediapipe
          mkdir -p $D/wasm
          curl -fsSL https://registry.npmjs.org/@mediapipe/tasks-vision/-/tasks-vision-0.10.14.tgz -o /tmp/tv.tgz
          tar -xzf /tmp/tv.tgz -C /tmp
          cp /tmp/package/vision_bundle.mjs $D/
          cp /tmp/package/wasm/* $D/wasm/
          curl -fsSL https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task -o $D/pose_landmarker_lite.task
          curl -fsSL https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task -o $D/pose_landmarker_full.task
          ls -la $D $D/wasm
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/garaetteok/vendor
          git diff --cached --quiet || git commit -m "가래떡 게임: 자세 인식 파일(MediaPipe) 사이트에 함께 올리기"
          git push
