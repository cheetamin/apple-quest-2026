# Cloudflare Worker 설정 (저장소 루트에서 배포) — 자세한 방법은 SETUP.md
name = "apple-quest-2026"
main = "server/worker.js"
compatibility_date = "2025-06-01"
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "apple_quest"
database_id = "bddf3ecd-b2a0-4918-8cfa-cd85d2ad4424"

# 공모전 체험판 전용 데이터베이스 (/contest/api/... 로 들어온 요청만 사용)
[[d1_databases]]
binding = "DB_CONTEST"
database_name = "apple_quest_contest"
database_id = "2e20c4fe-4da5-4463-8a2a-ded000c9c8b0"

# 공모전 체험판 'AI 선생님' — Cloudflare Workers AI (하루 무료 사용량, 키 필요 없음)
[ai]
binding = "AI"
